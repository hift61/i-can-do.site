<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>I CAN DO!</title>
  <link rel="icon" href="assets/team-emblem-transparent.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=quiet-emphasis-2">
  <script src="scene.js?v=4" defer></script>
</head>
<body>
  <canvas id="universe" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="#space" aria-label="I CAN DO! 홈">
      <img src="assets/team-emblem-transparent.png" width="1254" height="1254" alt="CAN-SAT 2026 팀 엠블럼">
      <span class="brand-name">I CAN DO!</span>
    </a>
  </header>
  <main id="journey" aria-label="우주에서 지상으로 내려오는 배경">
    <section id="space" class="journey-stage space-intro" aria-labelledby="motivation-title">
      <div class="motivation-composition">
        <h1 id="motivation-title" aria-label="우리도 우주에 갈 수 있을까?">
          <span class="question-intro">우리도</span>
          <strong class="question-universe">우주에</strong>
          <span class="question-ending">갈 수 있을까?</span>
        </h1>
        <a class="scroll-cue" href="#ground"><span id="scroll-label">SCROLL TO EARTH</span><span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section id="orbit" class="journey-stage" aria-label="지구에 접근"></section>
    <section id="atmosphere" class="journey-stage" aria-label="대기권으로 진입"></section>
    <section id="clouds" class="journey-stage" aria-label="구름 아래로 하강"></section>
    <section id="ground" class="journey-stage" aria-label="산과 땅이 가까워지는 지상"></section>
  </main>
  <div class="journey-progress" aria-hidden="true"><span>SPACE</span><div class="progress-track"><i id="progress-dot"></i></div><span>EARTH</span></div>
  <noscript><p class="fallback-note">스크롤 배경을 보려면 JavaScript를 켜주세요.</p></noscript>
</body>
</html>
